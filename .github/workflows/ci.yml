name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tools the packaging tests need
        run: python -m pip install "setuptools>=77" "packaging>=24.2" build
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m build
          python -m pip install dist/*.whl
      - name: Selftest the installed package
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          oathkey --version
          oathkey list
          oathkey selftest --verbose
