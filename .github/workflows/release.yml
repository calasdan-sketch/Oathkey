name: release

# Push a tag like v0.5.1 to publish that version to PyPI. One-time setup on
# pypi.org: add this repository and workflow (release.yml, environment "pypi")
# as a trusted publisher of the oathkey project. No token is stored here.
#
# A release only goes out when ALL of these hold: the tag matches the version
# in pyproject.toml; the tagged commit is on main (a tag pushed from a side
# branch is refused); the tests pass on the oldest and newest Python; the
# sdist and wheel build, pass `twine check --strict`, and the sdist's own copy
# of the tests passes; the wheel installs into a clean environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python -m unittest discover -s tests

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the whole history, so main can be compared with the tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml" >&2
            exit 1
          fi
      - name: The tagged commit must be on main
        run: |
          git rev-parse --verify --quiet origin/main >/dev/null || {
            echo "origin/main was not fetched, so the tag cannot be checked against it" >&2
            exit 1
          }
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "commit ${GITHUB_SHA} (tag ${GITHUB_REF_NAME}) is not on main; merge it first" >&2
            exit 1
          fi
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Run the tests from the sdist
        run: |
          mkdir "${RUNNER_TEMP}/sdist"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist"
          cd "${RUNNER_TEMP}"/sdist/*/
          python -m unittest discover -s tests
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/wheel-venv/bin/oathkey" --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
