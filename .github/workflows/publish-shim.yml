name: publish-shim

# Publishes the small 'safeeasyapi has moved to oathkey' package in shim/.
# Push a tag like shim-v0.9.0 (must equal shim/pyproject.toml's version, and be on main).
on:
  push:
    tags: ["shim-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the shim version and be on main
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' shim/pyproject.toml)
          if [ "shim-v${ver}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match shim version ${ver}" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          cd shim
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: shim/dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
