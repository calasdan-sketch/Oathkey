[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oathkey"
version = "0.4.0"
description = "The safe tunnel for API keys: guided setup, validation, and .env storage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["api-key", "api-keys", "secrets", "dotenv", "env-file", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/oathkey"
Issues = "https://github.com/calasdan-sketch/oathkey/issues"

[project.scripts]
oathkey = "oathkey.cli:main"

[tool.setuptools]
packages = ["oathkey"]

[tool.setuptools.package-data]
oathkey = ["recipes/*.json"]
