[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oathkey"
version = "0.5.0"
description = "Let your AI use your API keys without ever seeing them: a safe tunnel with one-command setup, a self-attack test and an activity log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["api-key", "api-keys", "secrets", "dotenv", "env-file", "mcp", "cli", "ai", "llm", "agents", "keychain", "model-context-protocol"]
authors = [{name = "Calas Automations Inc."}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/oathkey"
Issues = "https://github.com/calasdan-sketch/oathkey/issues"
Documentation = "https://github.com/calasdan-sketch/oathkey/blob/main/docs/guide.md"
Security = "https://github.com/calasdan-sketch/oathkey/security/policy"
Changelog = "https://github.com/calasdan-sketch/oathkey/releases"

[project.scripts]
oathkey = "oathkey.cli:main"

[tool.setuptools]
packages = ["oathkey"]

[tool.setuptools.package-data]
oathkey = ["recipes/*.json"]
