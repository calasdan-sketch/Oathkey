[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safeeasyapi"
version = "0.3.0"
description = "The safe tunnel for API keys: guided setup, validation, and .env storage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
]

[project.scripts]
safeeasyapi = "safeeasyapi.cli:main"

[tool.setuptools]
packages = ["safeeasyapi"]

[tool.setuptools.package-data]
safeeasyapi = ["recipes/*.json"]
