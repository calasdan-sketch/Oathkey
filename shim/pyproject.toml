[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeeasyapi"
version = "0.9.0"
description = "safeeasyapi has been renamed to oathkey. This package only installs oathkey and points to it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Calas Automations Inc." }]
dependencies = ["oathkey>=0.8.0"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/oathkey"
Source = "https://github.com/calasdan-sketch/oathkey"
Issues = "https://github.com/calasdan-sketch/oathkey/issues"

[project.scripts]
safeeasyapi = "safeeasyapi:main"

[tool.setuptools]
packages = ["safeeasyapi"]
